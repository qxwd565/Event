name: Publish HSdeck unified dated Event card API
on:
  push:
    paths:
      - '.github/workflows/normalize-card-history.yml'
      - 'tools/dated-migration-dates.json'
      - 'data/**'
      - 'cards.json'
      - 'release-policy.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dated-event-main
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch pinned source converter
        run: |
          curl -fsSL --retry 3 'https://raw.githubusercontent.com/qxwd565/legacy/733f4fb359732b0a3599029387082e968d77010a/tools/convert-to-dates-v1.py' -o /tmp/convert-to-dates-v1.py
      - name: Verify all 29 event-card first-available dates and convert
        run: |
          python /tmp/convert-to-dates-v1.py --root . --strict
          python /tmp/convert-to-dates-v1.py --root . --strict --check
          git diff --check
      - name: Commit only historical per-card JSON
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u -- data/
          if ! git diff --cached --quiet; then
            git commit -m 'Normalize all event cards to Korean date keys [skip ci]'
            git push origin HEAD:main
          fi
